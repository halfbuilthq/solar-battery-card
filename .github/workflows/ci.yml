name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run check

      - name: Confirm committed bundle is current
        run: git diff --exit-code -- dist/solar-battery-card.js

      - name: Install browser for layout checks
        run: npx playwright install --with-deps chromium

      - name: Verify responsive card layout
        run: npm run test:layout
