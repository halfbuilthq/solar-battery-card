<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar card design QA</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 28px;
        color: #111522;
        background: #e9edf1;
        font: 600 14px/1.4 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: repeat(2, 506px);
        align-items: start;
        gap: 28px;
        width: max-content;
        margin: 0 auto;
      }
      figure { margin: 0; }
      figcaption {
        margin-bottom: 10px;
        color: #566173;
        text-transform: uppercase;
        letter-spacing: .08em;
      }
      img {
        display: block;
        width: 506px;
        height: auto;
        border-radius: 17px;
        box-shadow: 0 10px 24px rgba(25, 37, 55, .12);
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Approved reference</figcaption>
        <img src="/design-qa-reference-506.png" alt="Approved solar and storage card concept" />
      </figure>
      <figure>
        <figcaption>Implemented prototype</figcaption>
        <img src="/design-qa-card.png" alt="Implemented solar and storage card" />
      </figure>
    </main>
  </body>
</html>
