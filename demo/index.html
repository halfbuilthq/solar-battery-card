<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar & Battery Card</title>
    <script type="module" src="/demo/demo.ts"></script>
  </head>
  <body>
    <main>
      <section class="demo-copy">
        <span class="eyebrow">Home Assistant custom card</span>
        <h1>Solar & Battery Card</h1>
        <p>Production component preview with representative Home Assistant entities.</p>
        <div class="demo-controls">
          <label>Units <select id="units"><option value="kilo">kW / kWh</option><option value="base">W / Wh</option></select></label>
          <label>Language <select id="language"><option value="en-AU">English</option><option value="de-DE">Deutsch</option></select></label>
          <label>Battery <select id="battery"><option value="charging">Charging</option><option value="discharging">Discharging</option><option value="reserve">At reserve</option><option value="tomorrow">Slow charge (next day)</option><option value="legacy">Legacy capacity</option><option value="unavailable">Unavailable SOC</option></select></label>
          <label>Solar forecast <select id="forecast"><option value="valid">Available</option><option value="zero">Zero</option><option value="unavailable">Unavailable</option><option value="hidden">Hidden</option><option value="incomplete">Incomplete hourly data</option></select></label>
          <label>Forecast format <select id="forecast-mode"><option value="daily">Daily target</option><option value="hourly">Hourly curve</option><option value="half-hourly">Half-hourly curve</option></select></label>
        </div>
      </section>
      <solar-battery-card></solar-battery-card>
    </main>
  </body>
</html>
